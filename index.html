<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Irumudi - Watch Movie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #000;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Direct HTML5 Native Video Player (Full Quality) -->
    <video controls autoplay name="media">
        <source src="movie.mp4" type="video/mp4">
        Your browser does not support the video tag or the file format is invalid.
    </video>

</body>
</html>
